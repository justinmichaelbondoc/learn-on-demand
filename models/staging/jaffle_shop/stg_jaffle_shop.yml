version: 2

models:
    - name: stg_customers
      description: Staged customer data from our jaffle shop app.
      columns: 
        - name: customer_id
          description: The primary key for customers.
          tests:
            - unique
            - not_null

    - name: stg_orders
      description: Staged order data from our jaffle shop app.
      columns: 
        - name: order_id
          description: Primary key for orders.
          tests:
            - relationships:
                arguments:
                  to: ref('stg_customers')
                  field: customer_id
                config:
                    severity: warn
        - name: status
          description: '{{ doc("order_status") }}'
          tests:
            - accepted_values:
                arguments:
                  values:
                    - completed
                    - shipped
                    - returned
                    - placed
                    - return_pending

    - name: stg_employees
      description: Staged employee data, passed through directly from the employees seed.
      columns:
        - name: employee_id
          description: Primary key for employees.
          tests:
            - unique
            - not_null
        - name: email
          description: Employee email address.
        - name: customer_id
          description: Foreign key to the customer this employee is linked to.

